<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%" fill="none" aria-hidden="true">
  <!-- 電車 / 車廂輪廓（精緻墨線風格） -->
  <rect x="24" y="28" width="112" height="48" rx="8" stroke="#1e3a5f" stroke-width="1.5" fill="#fbfaf7" />

  <!-- 電車頂部受電弓 -->
  <path d="M72 28 L80 16 L88 28" stroke="#5c6460" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="70" y1="16" x2="90" y2="16" stroke="#5c6460" stroke-width="1.2" stroke-linecap="round" />

  <!-- 電車車窗與車門 -->
  <rect x="34" y="36" width="22" height="18" rx="2" stroke="#1e3a5f" stroke-width="1.2" fill="#edf2f7" />
  <rect x="64" y="36" width="32" height="28" rx="2" stroke="#1e3a5f" stroke-width="1.2" fill="#fff" />
  <line x1="80" y1="36" x2="80" y2="64" stroke="#e8e4dc" stroke-width="1" />
  <rect x="104" y="36" width="22" height="18" rx="2" stroke="#1e3a5f" stroke-width="1.2" fill="#edf2f7" />

  <!-- 電車經典腰線（朱紅） -->
  <line x1="24" y1="58" x2="136" y2="58" stroke="#c53030" stroke-width="2" />

  <!-- 車燈 -->
  <circle cx="32" cy="68" r="2.5" fill="#c53030" opacity="0.8" />
  <circle cx="128" cy="68" r="2.5" fill="#c53030" opacity="0.8" />

  <!-- 鐵軌與車輪 -->
  <circle cx="48" cy="78" r="4.5" stroke="#1e3a5f" stroke-width="1.2" fill="#f8f6f0" />
  <circle cx="112" cy="78" r="4.5" stroke="#1e3a5f" stroke-width="1.2" fill="#f8f6f0" />
  <line x1="12" y1="83" x2="148" y2="83" stroke="#5c6460" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16" y1="86" x2="144" y2="86" stroke="#e8e4dc" stroke-width="1" stroke-dasharray="6 4" />

  <!-- 站牌簡約標示（右上側小圖騰） -->
  <g transform="translate(138, 14)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#1e3a5f" stroke-width="1.2" stroke-linecap="round" />
    <rect x="-14" y="2" width="14" height="10" rx="1.5" stroke="#1e3a5f" stroke-width="1" fill="#fff" />
    <line x1="-12" y1="5" x2="-2" y2="5" stroke="#c53030" stroke-width="1" />
    <line x1="-12" y1="9" x2="-5" y2="9" stroke="#1e3a5f" stroke-width="0.8" />
  </g>
</svg>
