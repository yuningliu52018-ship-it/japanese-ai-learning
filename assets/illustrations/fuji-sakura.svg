<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%" fill="none" aria-hidden="true">
  <!-- 柔和朱紅朝陽 -->
  <circle cx="100" cy="54" r="32" fill="#c53030" opacity="0.1" />

  <!-- 富士山輪廓（精緻墨色線稿） -->
  <path d="M42 98 C65 92, 78 52, 92 38 C95 34, 105 34, 108 38 C122 52, 135 92, 158 98"
        stroke="#1e3a5f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 富士雪頂分界線 -->
  <path d="M85 52 Q92 58 96 52 Q100 59 104 52 Q108 58 115 52"
        stroke="#1e3a5f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- 櫻花細枝（右上方輕垂） -->
  <path d="M180 18 Q155 24 140 38 Q130 48 126 56"
        stroke="#5c6460" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M152 28 Q146 16 138 14"
        stroke="#5c6460" stroke-width="1" stroke-linecap="round" fill="none" />

  <!-- 櫻花花瓣與花朵 -->
  <g transform="translate(138, 14)" fill="#c53030" opacity="0.75">
    <circle cx="0" cy="0" r="3" fill="#fff" stroke="#c53030" stroke-width="1" />
    <circle cx="-3" cy="-4" r="2.2" />
    <circle cx="4" cy="-3" r="2.2" />
    <circle cx="5" cy="3" r="2.2" />
    <circle cx="-1" cy="5" r="2.2" />
    <circle cx="-5" cy="1" r="2.2" />
  </g>
  <g transform="translate(142, 38)" fill="#c53030" opacity="0.8">
    <circle cx="0" cy="0" r="3.2" fill="#fff" stroke="#c53030" stroke-width="1" />
    <circle cx="-4" cy="-4" r="2.4" />
    <circle cx="4" cy="-4" r="2.4" />
    <circle cx="5" cy="2" r="2.4" />
    <circle cx="0" cy="6" r="2.4" />
    <circle cx="-5" cy="2" r="2.4" />
  </g>
  <!-- 飄落花瓣 -->
  <path d="M118 72 C116 68, 112 68, 114 74 C115 78, 120 76, 118 72 Z" fill="#c53030" opacity="0.6" />
  <path d="M132 86 C130 82, 126 83, 129 88 C131 91, 135 89, 132 86 Z" fill="#c53030" opacity="0.5" />

  <!-- 地平流雲線（淡墨） -->
  <path d="M28 98 L172 98" stroke="#e8e4dc" stroke-width="1" stroke-dasharray="3 3" />
</svg>
